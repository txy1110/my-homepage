<!DOCTYPE html>
<html lang="zh‑CN">

<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <title>v‑for遍历对象数组</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.38/vue.global.js"></script>
</head>

<body>
  <div id="app">
    <h3>学生对象数组</h3>
    <ul>
      <li v-for="(stu, index) in studentList" :key="index">
        序号：{{index+1}}
        姓名：{{stu.name}}
        年龄：{{stu.age}}
        成绩：{{stu.score}}
      </li>
    </ul>
  </div>

  <script>
    const { createApp } = Vue
    createApp({
      data() {
        return {
          // 对象数组：数组元素是对象
          studentList: [
            { name: "小明", age: 18, score: 92 },
            { name: "小红", age: 19, score: 85 },
            { name: "小刚", age: 18, score: 70 }
          ]
        }
      }
    }).mount('#app')
  </script>
</body>

</html>
